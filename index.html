
<!DOCTYPE html>
<html>
<head>
    <title>CampusConnect Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CampusConnect</h1>
        <p>Student Dashboard and Feed</p>
    </header>

    <section class="dashboard">
        <h2>Welcome to CampusConnect</h2>

        <form id="postForm">
            <input type="text" id="postInput"
                   placeholder="Share something...">
            <button type="submit">Post</button>
        </form>

        <p id="status"></p>

        <h2>Campus Feed</h2>
        <div id="feed">
            <p>Welcome to the campus community!</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
